<div class="min-h-screen bg-gradient-to-b from-orange-50 via-amber-50 to-orange-50 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-4xl space-y-4">
    <div class="px-0 py-0">
      <h1 class="text-base font-semibold tracking-tight text-slate-900">Profil Auteur</h1>
    </div>

    <div class="rounded-3xl border border-slate-200/80 bg-white p-6 shadow-sm">
      <div class="mb-6 flex items-center gap-4 border-b border-slate-200 pb-6">
        <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-600 ring-1 ring-emerald-100">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 1.8-8 4v2h16v-2c0-2.2-3.6-4-8-4Z"></path>
          </svg>
        </div>
        <div>
          <p class="text-base font-semibold text-slate-900">{{ user?.nom }}</p>
          <p class="text-sm text-slate-600">{{ user?.email }}</p>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
        <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4">
          <p class="text-xs font-semibold uppercase tracking-wider text-emerald-700">Articles</p>
          <p class="mt-1 text-2xl font-semibold text-emerald-700">{{ articlesCount }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
