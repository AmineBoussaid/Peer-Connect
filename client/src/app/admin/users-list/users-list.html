<div class="min-h-screen bg-gradient-to-b from-slate-50 via-white to-slate-50 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-7xl space-y-4">
    <div class="px-0 py-0">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h2 class="text-base font-semibold tracking-tight text-slate-900">Tous les utilisateurs</h2>
          <p class="mt-1 text-xs text-slate-500">Liste des utilisateurs avec leurs infos</p>
        </div>
        <button class="inline-flex items-center gap-1.5 rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-indigo-700" (click)="load()">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5m11 6v5h-5M20 9a8 8 0 0 0-13.66-5.66L4 5m16 14-2.34 1.66A8 8 0 0 1 4 15"></path>
          </svg>
          Actualiser
        </button>
      </div>
    </div>

    <div class="rounded-2xl border border-slate-200/80 bg-white p-3 shadow-sm sm:p-4">
      <div class="flex flex-col gap-3 sm:flex-row">
        <div class="relative flex-1">
          <svg class="pointer-events-none absolute left-2.5 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m1.6-5.15a6.75 6.75 0 1 1-13.5 0 6.75 6.75 0 0 1 13.5 0Z"></path>
          </svg>
          <input type="text" [(ngModel)]="filter" placeholder="Recherche (nom ou email)" class="w-full rounded-lg border border-slate-300 bg-white py-1.5 pl-8 pr-3 text-xs text-slate-900 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
        </div>
        <select [(ngModel)]="roleFilter" class="sm:w-44 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs text-slate-900 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
          <option value="all">Tous les rôles</option>
          <option value="admin">Admin</option>
          <option value="expert">Expert</option>
          <option value="auteur">Auteur</option>
        </select>
      </div>
    </div>

    <div class="overflow-x-auto rounded-3xl border border-slate-200/80 bg-white shadow-sm">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-50">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Nom</th>
            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Email</th>
            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Rôle</th>
            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr *ngFor="let u of paginatedUsers" class="transition-colors hover:bg-slate-50/70">
            <td class="px-4 py-3 font-semibold text-slate-900">{{ u.nom }}</td>
            <td class="px-4 py-3 text-slate-700">{{ u.email }}</td>
            <td class="px-4 py-3">
              <span class="rounded-full px-2.5 py-1 text-xs font-semibold" [class]="u.role === 'admin' ? 'bg-indigo-100 text-indigo-700' : (u.role === 'expert' ? 'bg-cyan-100 text-cyan-700' : 'bg-emerald-100 text-emerald-700')">
                {{ u.role | titlecase }}
              </span>
            </td>
            <td class="px-4 py-3">
              <button (click)="viewDetails(u.id_utilisateur)" class="rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-indigo-700">
                Détails
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="totalPages > 1" class="flex items-center justify-between rounded-2xl border border-slate-200/80 bg-white px-4 py-3 shadow-sm">
      <button class="rounded-lg px-3 py-1.5 text-xs font-medium text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50" (click)="prevPage()" [disabled]="page === 1">← Précédent</button>
      <p class="text-xs text-slate-600">
        Page <span class="font-semibold">{{ page }}</span> sur <span class="font-semibold">{{ totalPages }}</span> •
        <span class="font-semibold">{{ filtered.length }}</span> utilisateur(s)
      </p>
      <button class="rounded-lg px-3 py-1.5 text-xs font-medium text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50" (click)="nextPage()" [disabled]="page === totalPages">Suivant →</button>
    </div>
  </div>
</div>
